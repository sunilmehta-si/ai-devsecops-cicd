name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Unit tests
        run: make test
      - name: Secret scan (working tree and full history)
        run: make secrets secrets-history
      - name: YAML and workflow permission lint
        run: make lint-yaml
      - name: Validate Kubernetes manifests against admission rules
        run: python3 scripts/validate_manifests.py
